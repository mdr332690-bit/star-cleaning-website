<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="netlify-form-registration" content="star-cleaning-booking" />
    <title>Star Cleaning form registration</title>
  </head>
  <body>
    <form
      name="star-cleaning-booking"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="star-cleaning-booking" />
      <input type="text" name="fullName" />
      <input type="tel" name="mobile" />
      <input type="tel" name="whatsappNumber" />
      <select name="service">
        <option>Home Cleaning</option>
      </select>
      <input type="text" name="area" />
      <input type="date" name="preferredDate" />
      <input type="time" name="preferredTime" />
      <textarea name="message"></textarea>
      <input type="hidden" name="language" />
      <input name="bot-field" />
    </form>
  </body>
</html>
