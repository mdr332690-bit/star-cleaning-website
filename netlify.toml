[build]
  command = "vite build"
  publish = "dist/client"
[build.environment]
  NODE_VERSION = "24"
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8889

# Keep the static form-processing helper out of search results.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/review"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/ar/review"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin/reviews"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
